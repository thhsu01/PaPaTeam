# 這個 workflow 存在的理由：2026-08-04 的架構審查發現 ARCHITECTURE.md 的段落規格表
# 有三條規則寫了卻沒人檢查，因此長期漂移——導覽鍵文字跑出規格外的第三種、十頁的
# <h2> 各自改名、五頁把最高點畫成互相矛盾的「語意色」。收斂表甚至還掛著 ✅。
#
# 結論是：規格寫了卻沒有檢查，等於沒寫。tools/spec_sweep.py 把那張表變成可執行的
# 檢查，這個 workflow 則確保沒有人需要「記得」去跑它。

name: 規格檢查

on:
  # push 不限路徑：spec_sweep 現在也查 Markdown 與 manifest.json，只改文件的 push 一樣要跑；
  # 整支兩秒，不值得省。2026-09 的審查抓到原本的路徑清單漏了 *.md、manifest.json
  # 與另外三支工具。
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read        # 唯讀：本 workflow 只檢查，不寫回任何東西

jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 全站規格掃描
        run: python3 tools/spec_sweep.py

      # 行程事實在 trip 宣告一次、由槽填；剩下手寫的 meta、首頁卡片與散文裡順口提到的
      # 數字，這一步對著 trip 交叉核對，漏改其中一處會被擋下來，而不是靠人記得。
      - name: 行程事實一致性
        run: python3 tools/fact_check.py

      # 上面兩支全綠只證明「現在的倉庫沒問題」，不證明規則還抓得到東西。
      # 2026-09 的第四輪審查發現兩條規則早已紅不起來（一條只認「全程」而某頁寫「單程」，
      # 一條是字面比對、多一對括號就穿過），而 CI 從頭到尾都是綠的。
      # 這一步把每條規則配一個改壞動作，在暫時的副本上跑，要求它真的紅。
      - name: 規則本身還抓得到東西
        if: always()
        run: python3 tools/redteam.py

      # 上面任一步失敗時，把 ARCHITECTURE.md 的對應規則指出來，
      # 免得看到紅字卻不知道去哪查規範。
      - name: 失敗時附上規範出處
        if: failure()
        run: |
          {
            echo "### 規格檢查未通過"
            echo ""
            echo "規範出處："
            echo ""
            echo "- 段落 id、\`<h2>\` 主詞、共用區塊的掃載點 → \`ARCHITECTURE.md\` 的「段落規格」與「元件規格」"
            echo "- 灰階一律 stone、最高點語意色 \`#7c9e52\` → \`manifest.json\` 的 \`conventions\`"
            echo "- 每段里程不得短於兩航點直線距離 → \`ARCHITECTURE.md\` 的「里程健全性」"
            echo "- 每個航點都要有 \`advice\` → \`ARCHITECTURE.md\` 的「尚未收斂的一件事」"
            echo "- 手寫的 meta、首頁卡片、散文數字要與 \`trip\` 一致 → 由 \`tools/fact_check.py\` 交叉核對"
            echo ""
            echo "本機重現：\`python3 tools/spec_sweep.py\`（全過回傳 0）"
          } >> "$GITHUB_STEP_SUMMARY"
